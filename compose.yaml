name: acore-qr

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      NODE_ENV: production
      PORT: 4000
      APP_VERSION: 0.1.0
      WEB_ORIGIN: http://localhost:8080
      # Archivos (Fase 05): activos; el QR apunta a FILE_PUBLIC_BASE_URL/f/{token}
      FILE_UPLOAD_ENABLED: "true"
      FILE_PUBLIC_BASE_URL: http://localhost:4000
      FILE_TEMP_DIR: /data/acore-qr
      FILE_ALLOWED_TYPES: image/png,image/jpeg,image/webp,application/pdf,text/plain
    volumes:
      - file-storage:/data/acore-qr
    ports:
      - "4000:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_FILE_UPLOAD_ENABLED: "true"
    environment:
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  file-storage:
