name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Calidad (format, lint, typecheck, test, build, audit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qr
          POSTGRES_PASSWORD: qr
          POSTGRES_DB: acore_qr_test_dqr
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qr"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Los tests de QR dinámicos (Fase 06) migran y usan sus propias DBs de test.
      DATABASE_URL_TEST: postgres://qr:qr@localhost:5432/acore_qr_test_dqr
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install limpio
        run: npm ci

      - name: Formato
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Auditoría de dependencias
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Imágenes Docker y Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build imágenes
        run: docker compose build

      - name: Compose up y smoke de health
        run: |
          docker compose up -d
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4000/health/live >/dev/null 2>&1; then
              echo "health/live OK"
              exit 0
            fi
            sleep 2
          done
          echo "health/live no respondió a tiempo" >&2
          exit 1

      - name: Compose down
        if: always()
        run: docker compose down -v

  secrets:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
